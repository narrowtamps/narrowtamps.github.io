.gradient-text {
  /* 1. Define the linear gradient background */
  background-image: linear-gradient(to right, #ff7e5f, #feb47b);filter: drop-shadow(3px 3px 6px rgba(0, 0, 0, 0.753));
  
  /* 2. Clip the background strictly to the text characters */
  -webkit-background-clip: text;
  background-clip: text;
  
  /* 3. Make the inner text color completely transparent */
  -webkit-text-fill-color: transparent;
  color: transparent;
  
  /* 4. Good practice: ensure the element behaves like inline-block */
  display: inline-block;
}
